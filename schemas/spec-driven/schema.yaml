name: spec-driven
version: 1
description: Default OpenSpec workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      This document is implementation- and verification-oriented. It is not a verbatim
      copy of the company-format detailed design document. Instead, it should synthesize
      the most important engineering details from proposal.md, specs, and, when present,
      detailed-design.md.

      Before generating design.md, read:
      - proposal.md for motivation, scope, and capability boundaries
      - specs/** for functional requirements and behavioral constraints
      - detailed-design.md (if present) for interface definitions, flow design,
        persistence/database details, external dependencies, security constraints,
        and rollout considerations

      Sections:
      - **Context and Scope**: Background, scope, non-goals, and constraints
      - **Architecture Overview**: Involved modules/services, overall approach, and key interactions
      - **Interface Design**: Core interfaces relevant to implementation, key request/response fields,
        error handling, and auth/security expectations
      - **Key Business Flows**: Main flows, important exception flows, inputs/outputs, and state transitions
      - **Data and Persistence Design**: Core entities, persistence model, schema/index changes,
        consistency requirements, and migration-sensitive data concerns
      - **Infrastructure and External Dependencies**: Cloud resources, messaging, cache, third-party services,
        and environment/config changes that affect implementation
      - **Technical Decisions and Trade-offs**: Key technical choices, alternatives considered, and rationale
      - **Migration and Rollout**: Deployment steps, compatibility considerations, migration/rollback plan
      - **Risks and Mitigations**: Major implementation risks and how they will be mitigated
      - **Open Questions**: Outstanding uncertainties and decisions still to be confirmed

      Writing requirements:
      - Preserve implementation-critical detail; do not reduce the document to abstract summaries only
      - Synthesize detailed-design.md when present, but do not mechanically mirror its company-format structure
      - Prioritize information that directly affects coding, task breakdown, and verification
      - Explicitly retain key interface contracts, critical flows, database/persistence changes,
        external dependency impacts, security constraints, and rollout requirements
      - If proposal.md, specs, and detailed-design.md conflict, call out the conflict instead of guessing
      - Focus on engineering approach and implementation constraints, not line-by-line code details

      A good design.md should make it easier to generate actionable tasks.md
      and to verify later whether the implementation matches the intended design.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work into actionable, verifiable steps.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Before generating tasks.md, read:
      - specs/** for required behavior and acceptance expectations
      - design.md for implementation approach, interfaces, flows, data/persistence changes,
        infrastructure dependencies, rollout requirements, and key constraints

      Task generation principles:
      - Derive tasks from both specs and design.md
      - Prioritize implementation-critical work over descriptive detail
      - Convert design elements into tasks only when they require concrete engineering work
      - Do NOT mechanically turn every section or subsection of design.md into a task
      - Keep tasks small enough to complete in a focused work session
      - Order tasks by dependency and execution flow

      Include tasks for concrete work such as:
      - Interface/API implementation and integration
      - Core business flow implementation
      - Data model, persistence, schema, or index changes
      - Infrastructure, configuration, or external dependency integration
      - Testing, validation, migration, and rollout preparation where required
      - A final build/compile verification step for any change that affects code, build configuration,
        or runtime configuration used by the application

      Do not create standalone tasks for:
      - Background/context descriptions
      - Pure rationale or trade-off explanations
      - Open questions unless they require explicit follow-up work
      - Risks unless mitigation requires a concrete implementation step

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Organize tasks into logical implementation groups
      - Each task should be specific, actionable, verifiable, and scoped to a meaningful unit of engineering work
      - Order tasks by dependency (what must be done first?)
      - For changes that touch code or build/runtime configuration, the final task group MUST include
        an explicit build/compile verification task.
      - That final verification task MUST require running the project's standard build/compile command,
        fixing any reported errors, and rerunning the command until it succeeds.
      - If the project provides `infraspec/build-check.sh`, prefer that script as the explicit verification command in the final task.
      - Prefer wording that makes the verification task the last step of the checklist, after implementation work.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure
      - [ ] 1.2 Add dependencies to package.json

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities

      ## 3. Verification

      - [ ] 3.1 Run `infraspec/build-check.sh`, fix any reported build/compile errors, and rerun until it succeeds
      ```

      A good tasks.md should make implementation progress easy to track
      and should cover the key work implied by both the specs and the design.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
